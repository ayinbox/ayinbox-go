name: Release

# Go has no package registry upload: a pushed v* tag on the public repository
# is the release. This workflow checks the tag, publishes a GitHub release and
# asks the Go module proxy to fetch the version so pkg.go.dev lists it.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: stable
          cache: false
      - name: Check the tag matches Version
        run: |
          want="v$(sed -n 's/^const Version = "\(.*\)"$/\1/p' client.go)"
          if [ "$want" != "$GITHUB_REF_NAME" ]; then
            echo "Tag $GITHUB_REF_NAME does not match Version $want in client.go"
            exit 1
          fi
      - name: Test
        run: |
          go vet ./...
          go test -race -count=1 ./...
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" --verify-tag --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. Install: go get github.com/ayinbox/ayinbox-go@$GITHUB_REF_NAME"
      - name: Ask the Go module proxy to fetch the version
        run: |
          for i in 1 2 3 4 5; do
            if curl -fsS "https://proxy.golang.org/github.com/ayinbox/ayinbox-go/@v/${GITHUB_REF_NAME}.info"; then
              exit 0
            fi
            sleep 15
          done
          echo "The proxy did not return the version. Is the repository public?"
          exit 1
